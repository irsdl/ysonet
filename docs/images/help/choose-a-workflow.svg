<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Choose a YSoNet workflow</title>
  <desc id="desc">Three paths lead from guided setup, a known module, or a target constraint to module help, requirement review, and payload output.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07121e"/>
      <stop offset="0.5" stop-color="#102433"/>
      <stop offset="1" stop-color="#101c3f"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11434e"/>
      <stop offset="1" stop-color="#0b2f3a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17396b"/>
      <stop offset="1" stop-color="#111f49"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#70dfe4"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="24" fill="url(#background)"/>
  <text x="54" y="52" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Choose the shortest path to an answer</text>
  <text x="54" y="80" fill="#b9d6df" font-family="Segoe UI, Arial, sans-serif" font-size="17">Start with what you know. Every path ends with the same requirement review.</text>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(48 112)">
      <rect width="336" height="220" rx="20" fill="url(#teal)" stroke="#2ebfc6" stroke-width="2"/>
      <text x="26" y="42" fill="#73e7eb" font-size="15" font-weight="700" letter-spacing="1.5">GUIDED SETUP</text>
      <text x="26" y="78" fill="#ffffff" font-size="23" font-weight="700">I want help choosing</text>
      <rect x="26" y="100" width="284" height="40" rx="8" fill="#050b14" stroke="#365465"/>
      <text x="168" y="126" text-anchor="middle" fill="#70e6ea" font-family="Consolas, monospace" font-size="17">.\ysonet.exe -i</text>
      <text x="26" y="172" fill="#c7e7ec" font-size="16">Filter the menus, read setting help,</text>
      <text x="26" y="198" fill="#c7e7ec" font-size="16">then show the equivalent command.</text>
    </g>
    <g transform="translate(432 112)">
      <rect width="336" height="220" rx="20" fill="url(#blue)" stroke="#4b7ef0" stroke-width="2"/>
      <text x="26" y="42" fill="#8bb4ff" font-size="15" font-weight="700" letter-spacing="1.5">KNOWN MODULE</text>
      <text x="26" y="78" fill="#ffffff" font-size="23" font-weight="700">I know its name</text>
      <rect x="26" y="100" width="284" height="40" rx="8" fill="#050b14" stroke="#365465"/>
      <text x="168" y="126" text-anchor="middle" fill="#8bb4ff" font-family="Consolas, monospace" font-size="15">.\ysonet.exe -g DataSet -h</text>
      <text x="26" y="172" fill="#d4e2ff" font-size="16">Read its inputs, formatters, variants,</text>
      <text x="26" y="198" fill="#d4e2ff" font-size="16">options, and target requirements.</text>
    </g>
    <g transform="translate(816 112)">
      <rect width="336" height="220" rx="20" fill="url(#teal)" stroke="#2ebfc6" stroke-width="2"/>
      <text x="26" y="42" fill="#73e7eb" font-size="15" font-weight="700" letter-spacing="1.5">TARGET CONSTRAINT</text>
      <text x="26" y="78" fill="#ffffff" font-size="23" font-weight="700">I need to find a match</text>
      <rect x="26" y="100" width="284" height="40" rx="8" fill="#050b14" stroke="#365465"/>
      <text x="168" y="126" text-anchor="middle" fill="#70e6ea" font-family="Consolas, monospace" font-size="14">.\ysonet.exe --list gadgets</text>
      <text x="26" y="172" fill="#c7e7ec" font-size="16">Filter by formatter, input, effect,</text>
      <text x="26" y="198" fill="#c7e7ec" font-size="16">requirement, or runtime evidence.</text>
    </g>
  </g>

  <g fill="none" stroke="#70dfe4" stroke-width="3" marker-end="url(#arrow)">
    <path d="M216 338 V377"/>
    <path d="M600 338 V377"/>
    <path d="M984 338 V377"/>
  </g>

  <g filter="url(#shadow)" font-family="Segoe UI, Arial, sans-serif">
    <rect x="130" y="390" width="940" height="78" rx="18" fill="#122c42" stroke="#6bdde2" stroke-width="2"/>
    <text x="600" y="422" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="700">Review before generating</text>
    <text x="600" y="449" text-anchor="middle" fill="#c7e7ec" font-size="16">Target requirements + runtime evidence</text>
    <path d="M600 474 V491" fill="none" stroke="#70dfe4" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="410" y="504" width="380" height="42" rx="14" fill="#174674" stroke="#6b9eff" stroke-width="2"/>
    <text x="600" y="531" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Generate to stdout or --outputpath</text>
  </g>
</svg>
