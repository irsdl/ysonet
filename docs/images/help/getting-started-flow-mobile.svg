<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1120" viewBox="0 0 640 1120" role="img" aria-labelledby="title desc">
  <title id="title">From download to a first YSoNet payload</title>
  <desc id="desc">Five steps: download the release ZIP, extract every file, run installation diagnostics, open the interactive wizard, then save a payload or copy its command.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07121e"/><stop offset="1" stop-color="#101c3f"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#123a46"/><stop offset="1" stop-color="#132b58"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#57dce0"/></marker>
  </defs>
  <rect width="640" height="1120" rx="24" fill="url(#background)"/>
  <text x="32" y="48" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">From download to your first payload</text>
  <text x="32" y="76" fill="#b9d6df" font-family="Segoe UI,Arial,sans-serif" font-size="17">Five complete steps, in order.</text>
  <g fill="none" stroke="#57dce0" stroke-width="3" marker-end="url(#arrow)"><path d="M320 268 V286"/><path d="M320 458 V476"/><path d="M320 648 V666"/><path d="M320 838 V856"/></g>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(32 104)"><rect width="576" height="160" rx="18" fill="url(#card)" stroke="#2ebfc6" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#18aeb8"/><text x="38" y="46" text-anchor="middle" fill="#07121e" font-size="22" font-weight="800">1</text><text x="78" y="44" fill="#fff" font-size="27" font-weight="700">Download the release ZIP</text><text x="28" y="92" fill="#c7e7ec" font-size="20">Choose the built release asset, not a source archive.</text><text x="28" y="126" fill="#93bec8" font-size="18">No GitHub sign-in is required for release downloads.</text></g>
    <g transform="translate(32 294)"><rect width="576" height="160" rx="18" fill="url(#card)" stroke="#2ebfc6" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#18aeb8"/><text x="38" y="46" text-anchor="middle" fill="#07121e" font-size="22" font-weight="800">2</text><text x="78" y="44" fill="#fff" font-size="27" font-weight="700">Extract the complete archive</text><text x="28" y="92" fill="#c7e7ec" font-size="20">Keep the DLLs, configuration files, and subfolders</text><text x="28" y="126" fill="#93bec8" font-size="18">together in the extracted release folder.</text></g>
    <g transform="translate(32 484)"><rect width="576" height="160" rx="18" fill="url(#card)" stroke="#2ebfc6" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#18aeb8"/><text x="38" y="46" text-anchor="middle" fill="#07121e" font-size="22" font-weight="800">3</text><text x="78" y="44" fill="#fff" font-size="27" font-weight="700">Run installation diagnostics</text><rect x="28" y="70" width="520" height="45" rx="8" fill="#050b14" stroke="#365465"/><text x="288" y="100" text-anchor="middle" fill="#70e6ea" font-family="Consolas,monospace" font-size="20">.\ysonet.exe doctor</text><text x="28" y="142" fill="#93bec8" font-size="18">Read-only checks; no payload runs.</text></g>
    <g transform="translate(32 674)"><rect width="576" height="160" rx="18" fill="url(#card)" stroke="#4b7ef0" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#3875ef"/><text x="38" y="46" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">4</text><text x="78" y="44" fill="#fff" font-size="27" font-weight="700">Open the interactive wizard</text><rect x="28" y="70" width="520" height="45" rx="8" fill="#050b14" stroke="#365465"/><text x="288" y="100" text-anchor="middle" fill="#70a9ff" font-family="Consolas,monospace" font-size="20">.\ysonet.exe -i</text><text x="28" y="142" fill="#a9c7ff" font-size="18">Configure the module step by step.</text></g>
    <g transform="translate(32 864)"><rect width="576" height="160" rx="18" fill="url(#card)" stroke="#4b7ef0" stroke-width="2"/><circle cx="38" cy="38" r="22" fill="#3875ef"/><text x="38" y="46" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">5</text><text x="78" y="44" fill="#fff" font-size="27" font-weight="700">Review, then generate</text><text x="28" y="92" fill="#d4e2ff" font-size="20">Check requirements and runtime evidence first.</text><text x="28" y="126" fill="#a9c7ff" font-size="18">Save the payload or copy the equivalent command.</text></g>
  </g>
  <text x="320" y="1074" text-anchor="middle" fill="#b9d6df" font-family="Segoe UI,Arial,sans-serif" font-size="16">Use payloads only in systems you are authorized to assess.</text>
</svg>
