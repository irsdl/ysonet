<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1180" viewBox="0 0 640 1180" role="img" aria-labelledby="title desc">
  <title id="title">Choose a YSoNet workflow</title>
  <desc id="desc">Choose guided setup, help for a known module, or catalog filtering. Every path leads to requirement and runtime-evidence review before generation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07121e"/><stop offset="1" stop-color="#101c3f"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11434e"/><stop offset="1" stop-color="#0b2f3a"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17396b"/><stop offset="1" stop-color="#111f49"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#70dfe4"/></marker>
  </defs>
  <rect width="640" height="1180" rx="24" fill="url(#background)"/>
  <text x="32" y="48" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700">Choose one starting point</text>
  <text x="32" y="76" fill="#b9d6df" font-family="Segoe UI,Arial,sans-serif" font-size="17">Start with what you know.</text>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g transform="translate(32 104)"><rect width="576" height="190" rx="18" fill="url(#teal)" stroke="#2ebfc6" stroke-width="2"/><text x="28" y="38" fill="#73e7eb" font-size="15" font-weight="700" letter-spacing="1.5">GUIDED SETUP</text><text x="28" y="74" fill="#fff" font-size="27" font-weight="700">I want help choosing</text><rect x="28" y="92" width="520" height="42" rx="8" fill="#050b14" stroke="#365465"/><text x="288" y="120" text-anchor="middle" fill="#70e6ea" font-family="Consolas,monospace" font-size="20">.\ysonet.exe -i</text><text x="28" y="166" fill="#c7e7ec" font-size="18">Filter menus, read help, and show the equivalent command.</text></g>
    <text x="320" y="326" text-anchor="middle" fill="#8eacb8" font-size="17" font-weight="700">OR</text>
    <g transform="translate(32 348)"><rect width="576" height="190" rx="18" fill="url(#blue)" stroke="#4b7ef0" stroke-width="2"/><text x="28" y="38" fill="#8bb4ff" font-size="15" font-weight="700" letter-spacing="1.5">KNOWN MODULE</text><text x="28" y="74" fill="#fff" font-size="27" font-weight="700">I know its name</text><rect x="28" y="92" width="520" height="42" rx="8" fill="#050b14" stroke="#365465"/><text x="288" y="120" text-anchor="middle" fill="#8bb4ff" font-family="Consolas,monospace" font-size="20">.\ysonet.exe -g DataSet -h</text><text x="28" y="166" fill="#d4e2ff" font-size="18">Read inputs, formatters, variants, and target requirements.</text></g>
    <text x="320" y="570" text-anchor="middle" fill="#8eacb8" font-size="17" font-weight="700">OR</text>
    <g transform="translate(32 592)"><rect width="576" height="190" rx="18" fill="url(#teal)" stroke="#2ebfc6" stroke-width="2"/><text x="28" y="38" fill="#73e7eb" font-size="15" font-weight="700" letter-spacing="1.5">TARGET CONSTRAINT</text><text x="28" y="74" fill="#fff" font-size="27" font-weight="700">I need to find a match</text><rect x="28" y="92" width="520" height="42" rx="8" fill="#050b14" stroke="#365465"/><text x="288" y="120" text-anchor="middle" fill="#70e6ea" font-family="Consolas,monospace" font-size="19">.\ysonet.exe --list gadgets</text><text x="28" y="166" fill="#c7e7ec" font-size="18">Add a documented --category filter for your constraint.</text></g>
    <text x="320" y="830" text-anchor="middle" fill="#b9d6df" font-size="18" font-weight="700">Whichever path you choose</text>
    <path d="M320 850 V884" fill="none" stroke="#70dfe4" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="60" y="900" width="520" height="112" rx="18" fill="#122c42" stroke="#6bdde2" stroke-width="2"/>
    <text x="320" y="946" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">Review before generating</text><text x="320" y="980" text-anchor="middle" fill="#c7e7ec" font-size="19">Target requirements + runtime evidence</text>
    <path d="M320 1018 V1048" fill="none" stroke="#70dfe4" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="60" y="1062" width="520" height="70" rx="16" fill="#174674" stroke="#6b9eff" stroke-width="2"/>
    <text x="320" y="1106" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">Generate to stdout or --outputpath</text>
  </g>
</svg>
