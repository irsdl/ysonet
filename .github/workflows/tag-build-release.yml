name: Tag, Build & Publish Release

on:
  push:
    branches: [ master ]
    paths:
      - "VERSION"
  workflow_dispatch:
    inputs:
      version:
        description: "Version string like v2026.7.1 (vYEAR.MONTH.RELEASE)"
        required: true
        default: "v2026.7.1"
        type: string
      create_tag:
        description: "Create tag if it doesn't exist"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)
        with:
          fetch-depth: 0

      - name: Determine version
        id: v
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}".Trim()
          } else {
            $v = (Get-Content VERSION -Raw).Trim()
          }
          # Versioning is calendar based: vYEAR.MONTH.RELEASE (middle = month,
          # last = release count in that month). Example: v2026.7.1.
          if ($v -notmatch '^v\d+\.\d+\.\d+$') { throw "Unexpected VERSION format: $v (expected vYEAR.MONTH.RELEASE like v2026.7.1)" }
          $tag = "ysonet/$v"
          "value=$v"  >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"
          Write-Host "Tag: $tag"

      # Every release body opens with the standing sponsor page. It carries no names -
      # those are credited per release in docs/release-notes/<version>.md - so this only
      # proves the page is there and still has the heading the body needs.
      - name: Verify sponsor acknowledgement
        shell: pwsh
        run: |
          $path = "docs/sponsors.md"
          if (-not (Test-Path $path)) { throw "Release body source is missing: $path" }
          $text = Get-Content $path -Raw
          if ($text -notmatch '(?m)^##\s+Sponsors\s*$') { throw "$path lost the '## Sponsors' heading the release body needs." }
          Write-Host "Sponsor acknowledgement present: $path"

      - name: Check if tag already exists
        id: tagcheck
        shell: bash
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.v.outputs.tag }}" >/dev/null; then
            echo "exists=true"  >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Tag on a VERSION-change push, or on manual dispatch when asked and the tag is new.
      - name: Create annotated tag
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_tag == true && steps.tagcheck.outputs.exists == 'false') }}
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.v.outputs.tag }}" -m "Release ${{ steps.v.outputs.value }} (ysonet)"
          git push origin "${{ steps.v.outputs.tag }}"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3 (2026-03-20)

      - name: Setup NuGet
        uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0 (2026-04-15)

      - name: Ensure CLR2 self-test host toolchain
        shell: pwsh
        run: |
          $compiler = Join-Path $env:SystemRoot "Microsoft.NET\Framework\v3.5\csc.exe"
          if (-not (Test-Path $compiler)) {
            & dism.exe /Online /Enable-Feature /FeatureName:NetFx3 /All /NoRestart
            if ($LASTEXITCODE -ne 0) { throw "Could not enable the .NET Framework 3.5 build feature (DISM exit $LASTEXITCODE)." }
          }
          if (-not (Test-Path $compiler)) { throw "The CLR2 C# compiler is still unavailable at the standard framework location." }
          Write-Host "CLR2 self-test host compiler is available."

      - name: Restore
        run: nuget restore ysonet.sln

      - name: Build (Release)
        run: msbuild ysonet.sln -p:Configuration=Release -m

      - name: Verify CLR2 self-test hosts and FSharp.Core tool asset
        shell: pwsh
        run: |
          $hosts = @(
            @{ Path = ".\ysonet\bin\Release\ysonet.Clr2TestHost.exe"; Bits = "(32|64)" },
            @{ Path = ".\ysonet\bin\Release\ysonet.Clr2TestHost.x86.exe"; Bits = "32" },
            @{ Path = ".\ysonet\bin\Release\ysonet.Clr2TestHost.x64.exe"; Bits = "64" }
          )
          foreach ($entry in $hosts) {
            $hostPath = $entry.Path
            $configPath = "$hostPath.config"
            if (-not (Test-Path $hostPath)) { throw "Release is missing $hostPath." }
            if (-not (Test-Path $configPath)) { throw "Release is missing $configPath." }
            $probe = (& $hostPath --probe 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "CLR2 host probe failed for ${hostPath}: $probe" }
            if ($probe -notmatch '(?m)^clr=2\.0\.50727') { throw "CLR2 host did not report CLR 2.0.50727 for ${hostPath}: $probe" }
            if ($probe -notmatch "(?m)^bits=$($entry.Bits)\r?$") { throw "CLR2 host reported the wrong process bitness for ${hostPath}: $probe" }
            Write-Host $probe.Trim()
          }

          $fsharpAssets = @(
            @{ Path = ".\ysonet\bin\Release\FSharp.Core.dll"; Identity = "FSharp.Core, Version=4.3.1.0, Culture=neutral, PublicKeyToken=b03f5f7f11d50a3a" }
          )
          foreach ($asset in $fsharpAssets) {
            $assemblyPath = $asset.Path
            if (-not (Test-Path $assemblyPath)) { throw "Release is missing $assemblyPath." }
            $identity = [System.Reflection.AssemblyName]::GetAssemblyName((Resolve-Path $assemblyPath).Path).FullName
            if ($identity -cne $asset.Identity) { throw "FSharp.Core identity mismatch for ${assemblyPath}: expected $($asset.Identity), found $identity." }
            Write-Host "FSharp.Core asset: $assemblyPath -> $identity"
          }

      - name: Verify CLR4 test host
        shell: pwsh
        run: |
          $hostPath = ".\ysonet\bin\Release\ysonet.Clr4TestHost.exe"
          $configPath = "$hostPath.config"
          if (-not (Test-Path $hostPath)) { throw "Release is missing ysonet.Clr4TestHost.exe." }
          if (-not (Test-Path $configPath)) { throw "Release is missing the CLR4 host runtime config." }
          $probe = (& $hostPath --probe 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "CLR4 host probe failed: $probe" }
          if ($probe -notmatch '(?m)^clr=4\.') { throw "CLR4 host did not report a CLR 4 runtime: $probe" }
          Write-Host $probe.Trim()

      # The Release build string-encrypts ysonet.exe (see ysonet/obfuscar.xml and the
      # ObfuscateOutput target). String hiding is surgical: gadget signature strings are
      # encrypted, but benign user-facing text (banner, help) is kept in plain text so the
      # binary does not look like a crypt-everything packer. Verify both halves.
      - name: Verify obfuscation
        shell: pwsh
        run: |
          $exe = ".\ysonet\bin\Release\ysonet.exe"
          $bytes = [IO.File]::ReadAllBytes($exe)
          # Alignment-independent UTF-16 substring search. A whole-file Unicode decode from
          # offset 0 silently misses strings that sit at an odd byte offset, so scan for the
          # literal byte pattern instead.
          function Test-Utf16([byte[]]$hay, [string]$s) {
            $n = [Text.Encoding]::Unicode.GetBytes($s)
            for ($i = 0; $i -le $hay.Length - $n.Length; $i++) {
              $m = $true
              for ($j = 0; $j -lt $n.Length; $j++) { if ($hay[$i + $j] -ne $n[$j]) { $m = $false; break } }
              if ($m) { return $true }
            }
            return $false
          }
          # Gadget signature strings MUST be encrypted (absent as plain text).
          foreach ($sig in 'System.Windows.Data.ObjectDataProvider', 'MethodParameters') {
            if (Test-Utf16 $bytes $sig) { throw "Obfuscation check failed: signature literal still present: $sig" }
          }
          # Benign banner MUST stay in plain text (confirms surgical SkipStringHiding worked).
          if (-not (Test-Utf16 $bytes 'generates deserialization payloads')) { throw "Surgical string hiding failed: benign banner text was also encrypted." }
          if (Test-Path ".\ysonet\bin\Release\ysonet.pdb") { throw "ysonet.pdb should have been removed by obfuscation." }
          Write-Host "Obfuscation verified: signature strings encrypted, benign text preserved."

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -Path ".\ysonet\bin\Release\*" -DestinationPath "dist\ysonet-${{ steps.v.outputs.value }}.zip" -Force

      # The release body is assembled from tracked files: the sponsor thanks first,
      # then this version's highlights when they were written. GitHub pre-pends all of
      # it to the "What's Changed" list it generates.
      - name: Assemble release body
        shell: pwsh
        run: |
          $parts = @((Get-Content "docs/sponsors.md" -Raw))
          $highlights = "docs/release-notes/${{ steps.v.outputs.value }}.md"
          if (Test-Path $highlights) {
            $parts += (Get-Content $highlights -Raw)
            Write-Host "Release body: docs/sponsors.md + $highlights"
          } else {
            Write-Host "::warning::No highlights at $highlights, so this release note carries the sponsors and the generated notes only."
          }
          Set-Content -Path "dist/release-body.md" -Value ($parts -join "`n") -Encoding utf8

      - name: Publish GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0 (2026-03-14)
        with:
          tag:  ${{ steps.v.outputs.tag }}
          name: "YSoNet ${{ steps.v.outputs.value }}"
          generateReleaseNotes: true
          bodyFile: dist/release-body.md
          artifacts: "dist/ysonet-${{ steps.v.outputs.value }}.zip"

      # A body is only PRE-PENDED to the generated notes, so an action or API change
      # could drop it silently. Read the published release back and fail loudly.
      - name: Verify the published release note thanks the sponsors
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.v.outputs.tag }}"
          $body = (gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq ".body") -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "Could not read the published release $tag." }
          if ($body -notmatch '##\s+Sponsors') { throw "The published release note for $tag has no sponsor section." }
          $highlights = "docs/release-notes/${{ steps.v.outputs.value }}.md"
          if (-not (Test-Path $highlights)) {
            Write-Host "No highlights for this version, so it credits no sponsor by name."
            exit 0
          }
          if ($body -notmatch '##\s+Highlights') { throw "$highlights exists but the published release note for $tag has no Highlights section." }
          # Names are credited in the release their support paid for, so they are read
          # from THIS version notes rather than from the standing sponsors page. A
          # release that credits nobody new lists no handle here and passes.
          $text = Get-Content $highlights -Raw
          $section = [regex]::Match($text, '(?ms)^##\s+New sponsors\s*$(.*?)(?=^##\s|\z)')
          $names = @()
          if ($section.Success) {
            $names = [regex]::Matches($section.Groups[1].Value, '\[@([A-Za-z0-9-]+)\]') | ForEach-Object { $_.Groups[1].Value }
          }
          foreach ($n in $names) {
            if ($body -notmatch [regex]::Escape($n)) { throw "The published release note for $tag does not mention the sponsor $n." }
          }
          if ($names.Count -gt 0) { Write-Host "Published release note thanks: $($names -join ', ')" }
          else { Write-Host "This release credits no new sponsor by name." }
          Write-Host "Published release note carries the highlights from $highlights"
