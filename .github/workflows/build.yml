name: CI Build

on:
  push:
    branches: [ master ]
  workflow_dispatch:
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (2026-07-20)

      - name: Check documentation and CI tooling
        shell: pwsh
        run: |
          python -m unittest discover -s tools/ci -v
          if ($LASTEXITCODE -ne 0) { throw "Behavioral gate tests failed." }
          python -m unittest discover -s tools/docs -v
          if ($LASTEXITCODE -ne 0) { throw "Documentation tooling tests failed." }
          python tools/docs/check_docs.py links
          if ($LASTEXITCODE -ne 0) { throw "Documentation links are broken." }

      - name: Setup NuGet
        uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0 (2026-04-15)

      - name: Restore
        run: nuget restore ysonet.sln

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3 (2026-03-20)

      - name: Ensure CLR2 self-test host toolchain
        shell: pwsh
        run: |
          $compiler = Join-Path $env:SystemRoot "Microsoft.NET\Framework\v3.5\csc.exe"
          if (-not (Test-Path $compiler)) {
            & dism.exe /Online /Enable-Feature /FeatureName:NetFx3 /All /NoRestart
            if ($LASTEXITCODE -ne 0) { throw "Could not enable the .NET Framework 3.5 build feature (DISM exit $LASTEXITCODE)." }
          }
          if (-not (Test-Path $compiler)) { throw "The CLR2 C# compiler is still unavailable at the standard framework location." }
          Write-Host "CLR2 self-test host compiler is available."

      - name: Restore NET40 test-host reference assemblies
        shell: pwsh
        run: |
          # Build-only Microsoft reference assemblies, released 2022-08-19.
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 -Version 1.0.3 -Source https://api.nuget.org/v3/index.json -OutputDirectory temp/ci-reference-assemblies -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "Could not restore the NET40 test-host references." }
          $refs = (Resolve-Path "temp/ci-reference-assemblies/Microsoft.NETFramework.ReferenceAssemblies.net40.1.0.3/build/.NETFramework/v4.0").Path
          "NET40_REFERENCE_DIR=$refs" >> $env:GITHUB_ENV

      # Run explicitly so logs and environment evidence survive a failed suite.
      - name: Build (Debug)
        run: msbuild ysonet.sln -p:Configuration=Debug -p:RunYsonetTests=false -p:Net40ReferenceDir="$env:NET40_REFERENCE_DIR"

      - name: Test Debug (NORMAL)
        shell: pwsh
        run: |
          python tools/ci/test_gate.py run --tier normal --report temp/ci-reports/debug-normal --timeout 1200
          if ($LASTEXITCODE -ne 0) { throw "Debug NORMAL failed or has unverified coverage." }

      - name: Build (Release)
        run: msbuild ysonet.sln -p:Configuration=Release -p:Net40ReferenceDir="$env:NET40_REFERENCE_DIR"

      - name: Check CLI help and generated documentation
        shell: pwsh
        run: |
          & .\ysonet.Tests\bin\Release\ysonet.Tests.exe --docs
          if ($LASTEXITCODE -ne 0) { throw "CLI help or generated documentation is out of date." }

      - name: Verify CLR2 self-test hosts and FSharp.Core tool asset
        shell: pwsh
        run: |
          $hosts = @(
            @{ Path = ".\ysonet\bin\Release\ysonet.Clr2TestHost.exe"; Bits = "(32|64)" },
            @{ Path = ".\ysonet\bin\Release\ysonet.Clr2TestHost.x86.exe"; Bits = "32" },
            @{ Path = ".\ysonet\bin\Release\ysonet.Clr2TestHost.x64.exe"; Bits = "64" }
          )
          foreach ($entry in $hosts) {
            $hostPath = $entry.Path
            $configPath = "$hostPath.config"
            if (-not (Test-Path $hostPath)) { throw "Release is missing $hostPath." }
            if (-not (Test-Path $configPath)) { throw "Release is missing $configPath." }
            $probe = (& $hostPath --probe 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw "CLR2 host probe failed for ${hostPath}: $probe" }
            if ($probe -notmatch '(?m)^clr=2\.0\.50727') { throw "CLR2 host did not report CLR 2.0.50727 for ${hostPath}: $probe" }
            if ($probe -notmatch "(?m)^bits=$($entry.Bits)\r?$") { throw "CLR2 host reported the wrong process bitness for ${hostPath}: $probe" }
            Write-Host $probe.Trim()
          }

          $fsharpAssets = @(
            @{ Path = ".\ysonet\bin\Release\FSharp.Core.dll"; Identity = "FSharp.Core, Version=4.3.1.0, Culture=neutral, PublicKeyToken=b03f5f7f11d50a3a" }
          )
          foreach ($asset in $fsharpAssets) {
            $assemblyPath = $asset.Path
            if (-not (Test-Path $assemblyPath)) { throw "Release is missing $assemblyPath." }
            $identity = [System.Reflection.AssemblyName]::GetAssemblyName((Resolve-Path $assemblyPath).Path).FullName
            if ($identity -cne $asset.Identity) { throw "FSharp.Core identity mismatch for ${assemblyPath}: expected $($asset.Identity), found $identity." }
            Write-Host "FSharp.Core asset: $assemblyPath -> $identity"
          }

      - name: Verify CLR4 test host
        shell: pwsh
        run: |
          $hostPath = ".\ysonet\bin\Release\ysonet.Clr4TestHost.exe"
          $configPath = "$hostPath.config"
          if (-not (Test-Path $hostPath)) { throw "Release is missing ysonet.Clr4TestHost.exe." }
          if (-not (Test-Path $configPath)) { throw "Release is missing the CLR4 host runtime config." }
          $probe = (& $hostPath --probe 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "CLR4 host probe failed: $probe" }
          if ($probe -notmatch '(?m)^clr=4\.') { throw "CLR4 host did not report a CLR 4 runtime: $probe" }
          Write-Host $probe.Trim()

      # The Release build string-encrypts ysonet.exe (see ysonet/obfuscar.xml and the
      # ObfuscateOutput target). String hiding is surgical: gadget signature strings are
      # encrypted, but benign user-facing text (banner, help) is kept in plain text so the
      # binary does not look like a crypt-everything packer. Verify both halves.
      - name: Verify obfuscation
        shell: pwsh
        run: |
          $exe = ".\ysonet\bin\Release\ysonet.exe"
          $bytes = [IO.File]::ReadAllBytes($exe)
          # Alignment-independent UTF-16 substring search. A whole-file Unicode decode from
          # offset 0 silently misses strings that sit at an odd byte offset, so scan for the
          # literal byte pattern instead.
          function Test-Utf16([byte[]]$hay, [string]$s) {
            $n = [Text.Encoding]::Unicode.GetBytes($s)
            for ($i = 0; $i -le $hay.Length - $n.Length; $i++) {
              $m = $true
              for ($j = 0; $j -lt $n.Length; $j++) { if ($hay[$i + $j] -ne $n[$j]) { $m = $false; break } }
              if ($m) { return $true }
            }
            return $false
          }
          # Gadget signature strings MUST be encrypted (absent as plain text).
          foreach ($sig in 'System.Windows.Data.ObjectDataProvider', 'MethodParameters') {
            if (Test-Utf16 $bytes $sig) { throw "Obfuscation check failed: signature literal still present: $sig" }
          }
          # Benign banner MUST stay in plain text (confirms surgical SkipStringHiding worked).
          if (-not (Test-Utf16 $bytes 'generates deserialization payloads')) { throw "Surgical string hiding failed: benign banner text was also encrypted." }
          if (Test-Path ".\ysonet\bin\Release\ysonet.pdb") { throw "ysonet.pdb should have been removed by obfuscation." }
          Write-Host "Obfuscation verified: signature strings encrypted, benign text preserved."

      - name: Package artifact
        shell: pwsh
        run: |
          python tools/ci/test_gate.py package ysonet/bin/Release dist/ysonet-ci.zip
          if ($LASTEXITCODE -ne 0) { throw "Could not package Release." }

      - name: Test packaged Release (NORMAL)
        shell: pwsh
        run: |
          python tools/ci/test_gate.py run --tier normal --package dist/ysonet-ci.zip --report temp/ci-reports/package-normal --timeout 1200
          if ($LASTEXITCODE -ne 0) { throw "Packaged Release NORMAL failed or has unverified coverage." }

      - name: Create unsigned build evidence
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          python tools/ci/release_evidence.py create --archive dist/ysonet-ci.zip --report temp/ci-reports/package-normal --output dist --version $version
          if ($LASTEXITCODE -ne 0) { throw "Build evidence is incomplete." }
          python tools/ci/release_evidence.py verify dist
          if ($LASTEXITCODE -ne 0) { throw "Build checksum verification failed." }

      - name: Summarize behavioral tests
        if: always()
        shell: pwsh
        run: python tools/ci/test_gate.py summary --reports temp/ci-reports --expect debug-normal package-normal

      - name: Upload behavioral test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (2026-04-10)
        with:
          name: build-test-results-${{ github.sha }}
          path: temp/ci-reports
          if-no-files-found: warn

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (2026-04-10)
        with:
          name: ysonet-${{ github.sha }}
          path: |
            dist/ysonet-ci.zip
            dist/SHA256SUMS
            dist/build-provenance.json
            dist/component-inventory.json
            dist/runtime-evidence.json
            dist/runtime-evidence.csv
            dist/runtime-evidence.html
          if-no-files-found: error
